version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "9000:9000"  # exposed directly so we can measure UNMITIGATED baseline
                       # traffic for comparison; not something you'd do in a
                       # real deployment, where only the gateway is public.
    expose:
      - "9000"

  gateway-a:
    build: ./gateway
    environment:
      REPLICA_ID: A
      PORT: 8080
      REDIS_ADDR: redis:6379
      BACKEND_URL: http://backend:9000
    depends_on:
      - redis
      - backend
    expose:
      - "8080"

  gateway-b:
    build: ./gateway
    environment:
      REPLICA_ID: B
      PORT: 8080
      REDIS_ADDR: redis:6379
      BACKEND_URL: http://backend:9000
    depends_on:
      - redis
      - backend
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - gateway-a
      - gateway-b

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway-a
      - gateway-b

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus