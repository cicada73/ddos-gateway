events {}

http {
    upstream gateway_replicas {
        # Round-robin by default - nginx sends consecutive requests to
        # different replicas, which is exactly what makes shared Redis
        # state necessary: without it, a client bounced between replicas
        # would get a different bucket from each one.
        server gateway-a:8080;
        server gateway-b:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://gateway_replicas;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}