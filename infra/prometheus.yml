global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway-a:8080", "gateway-b:8080"]
        labels:
          # Redundant with the 'replica' label already inside each metric
          # (set from REPLICA_ID in the Go code), but having it as a
          # Prometheus-level label too means you can filter/group by it
          # directly in Grafana without relying on the app having labeled
          # it correctly itself - a second, independent source of truth.
          service: "gateway"